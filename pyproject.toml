[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civil-eng-agent"
version = "0.1.0"
description = "Civil Engineering Design Assistant — MCP Server for York Region road design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sqlite-vec>=0.1.1",
    "voyageai>=0.3",
    "anthropic>=0.34",
    "click>=8.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
local-embed = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
civil-eng-agent = "civil_eng_agent.ingestion.cli:cli"
civil-eng-agent-serve = "civil_eng_agent.server:serve"

[tool.hatch.build.targets.wheel]
packages = ["src/civil_eng_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
